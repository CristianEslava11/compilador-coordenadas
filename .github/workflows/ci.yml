name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r src/requirements-web.txt pytest httpx
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t geoquery .
      - name: Arrancar contenedor y comprobar la UI
        run: |
          docker run -d -p 8000:8000 --name geo geoquery
          for i in $(seq 1 20); do curl -sf http://localhost:8000/ && break; sleep 1; done
          curl -sf http://localhost:8000/ui/ | grep -q GeoQuery
